server:
  port: ${PORT:3000}
  tomcat:
    threads:
      max: 200
      min-spare: 10

spring:
  application:
    name: sylvia-bookhouse-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 数据库连接通过环境变量 DB_URL / DB_USERNAME / DB_PASSWORD 配置（见 .env.example）
    url: ${DB_URL:jdbc:mysql://localhost:3306/sylvia_v4?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 30000

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 业务配置（Key 只存在于服务端 .env / 环境变量）
sylvia:
  jwt-secret: ${JWT_SECRET:sylvia-book-house-dev-secret-change-me}
  tts-api-key: ${TTS_API_KEY:}
  ark-api-key: ${ARK_API_KEY:}
  llm-api-key: ${LLM_API_KEY:}
  llm-base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  llm-model: ${LLM_MODEL:deepseek-chat}
  public-dir: ${PUBLIC_DIR:./public}

logging:
  level:
    root: INFO
    com.sylvia: INFO
  file:
    name: ./sylvia-server.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
